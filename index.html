<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;z-index:10}
#start h1{font-size:3rem;font-weight:700;letter-spacing:2px}
#name{position:fixed;top:20px;left:20px;font-size:1.5rem;font-weight:bold;display:none;z-index:20}
video{width:100vw;height:100vh;object-fit:cover;display:none}
</style>
</head>
<body>
<div id="start"><h1>Click to Start</h1></div>
<div id="name"></div>

<video id="amv" playsinline>
    <source src="LIL DARKIE - i can see clearly (PROD. WENDIGO) (MUSIC VIDEO).mp4" type="video/mp4">
</video>

<script>
const start=document.getElementById('start');
const vid=document.getElementById('amv');
const name=document.getElementById('name');

start.onclick=()=>{
    start.style.display='none';
    vid.style.display='block';
    name.style.display='block';
    vid.play();
};
</script>
</body>
</html>
