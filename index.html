  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  cursor:pointer;

}

#start h1{
  font-size:3rem;
  font-weight:700;

}

video{
  width:100vw;
  height:100vh;
  object-fit:cover;

}
</style>
</head>
<body>

<div id="start"><h1>Click to Start</h1></div>

<video id="amv" playsinline>
  <source src="LIL DARKIE - i can see clearly (PROD. WENDIGO) (MUSIC VIDEO).mp4" type="video/mp4">
</video>

<script>
const start = document.getElementById('start');
const vid = document.getElementById('amv');

start.onclick = () => {
  start.style.display = 'none';
  vid.style.display = 'block';
  vid.play();
};
</script>
